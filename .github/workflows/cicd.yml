name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t devops-lab-app:latest .

      - name: Verify Docker Image
        run: |
          docker images | grep devops-lab-app

      - name: Kubernetes Deployment
        run: |
          echo "Kubernetes deployment stage"
          echo "Deployment: devops-app"
          echo "Service: devops-service"
          echo "Replicas: 2"
          echo "NodePort: 30102"

      - name: CI/CD Success
        run: |
          echo "================================="
          echo "CI/CD PIPELINE SUCCESSFUL"
          echo "Checkout Code       : SUCCESS"
          echo "Build Docker Image  : SUCCESS"
          echo "Kubernetes Stage    : READY"
          echo "================================="
