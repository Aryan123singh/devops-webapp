name: AWS CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Files
        run: |
          echo "Checking project files..."
          ls -la

      - name: Build / Validate Website
        run: |
          echo "Validating website..."
          test -f index.html
          test -f style.css
          echo "Website validation successful!"
          
      - name: Slack Success Notification
        if: success()
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"✅ CI/CD Pipeline SUCCESS - devops-webapp"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}
            
      - name: Slack Failure Notification
        if: failure()
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"❌ CI/CD Pipeline FAILED - devops-webapp"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}
